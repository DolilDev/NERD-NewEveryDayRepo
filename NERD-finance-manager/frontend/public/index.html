<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NERD Finance Manager</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>💰 NERD Finance Manager</h1>
      <p class="app-header__subtitle">Track your income and expenses</p>
    </header>

    <main class="layout">
      <!-- Dashboard: totals computed from all records -->
      <section class="dashboard" aria-label="Summary">
        <article class="card card--income">
          <span class="card__label">Total Income</span>
          <span class="card__value" id="total-income">$0.00</span>
        </article>
        <article class="card card--expense">
          <span class="card__label">Total Expenses</span>
          <span class="card__value" id="total-expense">$0.00</span>
        </article>
        <article class="card card--balance">
          <span class="card__label">Balance</span>
          <span class="card__value" id="balance">$0.00</span>
        </article>
      </section>

      <div class="content">
        <!-- Add / edit form -->
        <aside class="panel form-panel">
          <form id="record-form" class="record-form" novalidate>
            <h2 id="form-title">Add a record</h2>
            <input type="hidden" id="record-id" />

            <div class="form-row">
              <label for="type">Type</label>
              <select id="type" name="type">
                <option value="expense">Expense</option>
                <option value="income">Income</option>
              </select>
              <small class="field-error" id="err-type"></small>
            </div>

            <div class="form-row">
              <label for="amount">Amount</label>
              <input
                type="number"
                id="amount"
                name="amount"
                step="0.01"
                min="0"
                placeholder="0.00"
              />
              <small class="field-error" id="err-amount"></small>
            </div>

            <div class="form-row">
              <label for="category">Category</label>
              <input type="text" id="category" name="category" placeholder="e.g. Groceries" />
              <small class="field-error" id="err-category"></small>
            </div>

            <div class="form-row">
              <label for="description">
                Description <span class="optional">(optional)</span>
              </label>
              <input type="text" id="description" name="description" placeholder="Notes" />
            </div>

            <div class="form-row">
              <label for="date">Date</label>
              <input type="date" id="date" name="date" />
              <small class="field-error" id="err-date"></small>
            </div>

            <p class="form-error" id="form-error" role="alert"></p>

            <div class="form-actions">
              <button type="submit" id="submit-btn">Add record</button>
              <button type="button" id="cancel-btn" class="btn-secondary hidden">Cancel</button>
            </div>
          </form>
        </aside>

        <!-- Records list -->
        <section class="panel records-panel" aria-label="Records">
          <div class="records-panel__header">
            <h2>Records</h2>
            <button type="button" id="reset-btn" class="btn-danger">Reset all</button>
          </div>

          <table class="records-table">
            <thead>
              <tr>
                <th>Type</th>
                <th>Amount</th>
                <th>Category</th>
                <th>Description</th>
                <th>Date</th>
                <th aria-label="Actions"></th>
              </tr>
            </thead>
            <tbody id="records-body"></tbody>
          </table>

          <p id="empty-state" class="empty-state">No records yet. Add your first one above.</p>
        </section>
      </div>
    </main>

    <script type="module" src="./dist/bundle.js"></script>
  </body>
</html>
