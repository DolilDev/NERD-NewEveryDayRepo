<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSV Data Assistant</title>
  <style>
    :root { --accent: #2d6cdf; --bg: #f5f7fa; --border: #d9dee6; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
           margin: 0; background: var(--bg); color: #1c2330; }
    .wrap { max-width: 920px; margin: 0 auto; padding: 2rem 1.25rem; }
    h1 { margin: 0 0 .25rem; }
    .sub { color: #5b6472; margin: 0 0 1.5rem; }
    .card { background: #fff; border: 1px solid var(--border); border-radius: 10px;
            padding: 1.25rem 1.5rem; margin-bottom: 1.25rem; }
    label { display: block; font-weight: 600; margin: .75rem 0 .25rem; font-size: .9rem; }
    input, select { width: 100%; padding: .55rem .65rem; border: 1px solid var(--border);
                    border-radius: 6px; font-size: .95rem; background: #fff; }
    .row { display: flex; gap: 1rem; flex-wrap: wrap; }
    .row > div { flex: 1 1 160px; }
    button, .btn { background: var(--accent); color: #fff; border: 0; border-radius: 6px;
            padding: .6rem 1.1rem; font-size: .95rem; cursor: pointer; text-decoration: none;
            display: inline-block; margin-top: 1rem; }
    button:hover, .btn:hover { background: #1f57bd; }
    .btn.secondary { background: #5b6472; }
    .flash { background: #fdecea; color: #8a1c12; border: 1px solid #f4c7c3;
             padding: .75rem 1rem; border-radius: 6px; margin-bottom: 1rem; }
    table.data-table { border-collapse: collapse; width: 100%; font-size: .9rem; }
    table.data-table th, table.data-table td { border: 1px solid var(--border);
             padding: .45rem .6rem; text-align: left; }
    table.data-table th { background: #eef2f8; }
    table.data-table tr:nth-child(even) td { background: #fafbfd; }
    .table-scroll { overflow-x: auto; }
    .muted { color: #5b6472; font-size: .85rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>CSV Data Assistant</h1>
    <p class="sub">Upload a CSV, transform it, download the result.</p>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}<div class="flash">{{ message }}</div>{% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
